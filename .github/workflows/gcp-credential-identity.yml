# GCP credential identity probe — part of the credential-ROTATION operation (2026-10-04).
#
# Answers "which service-account key does this GitHub secret hold?" from the secret itself,
# printing ONLY client_email, private_key_id and project_id. Never the key; never inferred from
# secret-update or key-creation timestamps. No GCP auth, no network, no writes.
#
#   scope = repository     → the repo-level secret GCP_SA_JSON (what bq-awards-ingest.yml reads today)
#   scope = bq-production  → the secret as seen by jobs in the bq-production environment
#                            (an environment secret of the same name overrides the repo secret);
#                            requires the environment's reviewer approval like any bq-production job.
name: GCP credential identity

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Which secret to identify
        type: choice
        required: true
        default: repository
        options:
          - repository
          - bq-production
      expect_key_id_prefix:
        description: Optional — hex prefix of a key id to compare against (e.g. the exposed key's first 6 chars)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gcp-credential-identity
  cancel-in-progress: false

jobs:
  repository:
    if: inputs.scope == 'repository'
    name: Identify repository secret
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Print credential identifiers (never the key)
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          EXPECT_PREFIX: ${{ inputs.expect_key_id_prefix }}
        run: |
          set +x
          node scripts/gcp-credential-identity.mjs --scope repository --expect-prefix "$EXPECT_PREFIX"

  bq_production:
    if: inputs.scope == 'bq-production'
    name: Identify bq-production secret
    runs-on: ubuntu-latest
    environment: bq-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Print credential identifiers (never the key)
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          EXPECT_PREFIX: ${{ inputs.expect_key_id_prefix }}
        run: |
          set +x
          node scripts/gcp-credential-identity.mjs --scope bq-production --expect-prefix "$EXPECT_PREFIX"
