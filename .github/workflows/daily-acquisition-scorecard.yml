# Weekday acquisition scorecard. Runs on GitHub-hosted runners, not a laptop.
# Schedule fires only after this file is on the default branch. workflow_dispatch
# can run it from a branch.
#
# Secrets (already used by bq-awards-ingest.yml and bq-awards-idv-migration.yml):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# The scorecard issues GET /rest/v1 only. The job must not print those values.
#
# An automated reader with Actions read on this repo:
#   1. GET /repos/ecoffie/market-assassin/actions/workflows/daily-acquisition-scorecard.yml/runs?status=success&per_page=1
#   2. GET /repos/ecoffie/market-assassin/actions/runs/<run_id>/artifacts
#   3. GET /repos/ecoffie/market-assassin/actions/artifacts/<artifact_id>/zip
# The zip is artifact `daily-acquisition-scorecard` and holds
# acquisition-scorecard.json and acquisition-scorecard.md.
# The same markdown is the job summary on that run.
name: Daily acquisition scorecard

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC Monday–Friday. Morning in US Eastern (07:00 EST / 08:00 EDT).
    - cron: '0 12 * * 1-5'

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-acquisition-scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    name: Acquisition scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build scorecard
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +x
          node scripts/daily-acquisition-scorecard.mjs --out-dir "$RUNNER_TEMP/scorecard"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scorecard/acquisition-scorecard.md" ]; then
            cat "$RUNNER_TEMP/scorecard/acquisition-scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scorecard file was not written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-acquisition-scorecard
          path: |
            ${{ runner.temp }}/scorecard/acquisition-scorecard.json
            ${{ runner.temp }}/scorecard/acquisition-scorecard.md
          if-no-files-found: warn
          retention-days: 30
