# Weekday acquisition scorecard.
# The production job requests a GitHub OIDC token and exchanges it for a
# 30-minute scorecard_reader password. It stores no database password, no
# signing secret, and no GitHub admin token.
# A pull request runs only the local privilege job.
name: Daily acquisition scorecard

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # 12:45 UTC Monday–Friday.
    # 7:45 AM Eastern Standard Time, after the 7:20 AM ET collector and before
    # the 8:00 AM ET reader. During daylight time this same cron is 8:45 AM ET.
    - cron: '45 12 * * 1-5'

permissions:
  contents: read

concurrency:
  group: daily-acquisition-scorecard
  cancel-in-progress: false

jobs:
  privileges:
    name: Scorecard privileges
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-production
          POSTGRES_USER: postgres
          POSTGRES_DB: scorecard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Assert effective privileges
        env:
          SCORECARD_CI_DATABASE_URL: postgresql://postgres:ci-only-not-production@localhost:5432/scorecard
        run: node scripts/scorecard-privilege-ci.mjs

  scorecard:
    name: Acquisition scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build scorecard
        env:
          SCORECARD_CREDENTIAL_URL: https://getmindy.ai/api/scorecard/credential
        run: |
          set +x
          node scripts/scorecard-run.mjs --out-dir "$RUNNER_TEMP/scorecard"

      - name: Publish job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scorecard/acquisition-scorecard.md" ]; then
            cat "$RUNNER_TEMP/scorecard/acquisition-scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scorecard numbers are unknown. No report was published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scorecard
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-acquisition-scorecard
          path: |
            ${{ runner.temp }}/scorecard/acquisition-scorecard.json
            ${{ runner.temp }}/scorecard/acquisition-scorecard.md
          if-no-files-found: error
          retention-days: 30
