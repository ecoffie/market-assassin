# Task 0C — the minimum CI needed to enforce one invariant:
#
#   A PR cannot merge while a decision-chain behavioural regression is failing.
#
# Deliberately minimal. This is NOT deployment CI.
name: decision-chain

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

jobs:
  verify:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Seam layer: real product code, data boundary stubbed. Deterministic, no network.
      # Decision-chain LIVE tests stay excluded (nightly). Maps account chrome source
      # is the merge gate. `--live` here is CURRENT production, not this PR — a
      # 401 with credentials fails; missing credentials are NOT TESTED.
      - name: Decision-chain (seam)
        run: npm run test:chain

      - name: Unit suite
        run: npm run test:unit

      # usaspending.awards must never be destructively rewritten by a new code path (the parity
      # test in the unit suite pins the rebuild's column list; this pins WHO may rebuild).
      - name: Awards destructive-writer audit
        run: node scripts/audit-awards-schema-writers.mjs --self-test && node scripts/audit-awards-schema-writers.mjs

      - name: Maps account chrome (source)
        run: npm run verify:maps-account

      - name: Maps account chrome (live current host)
        run: npm run verify:maps-account -- --live

  # After Vercel marks Production Ready, pin the serving SHA to that deploy.
  maps-account-prod:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && contains(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Maps account chrome (this production SHA)
        run: npm run verify:maps-account -- --live --expect-sha ${{ github.event.deployment.sha }}

  # The PRD's "confirmed live signal". Not a merge gate — a truth gate.
  # A defect closes on this, never on a green PR.
  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Decision-chain (live)
        env:
          MCP_LIVE_URL: ${{ secrets.MCP_LIVE_URL }}
          MCP_LIVE_TOKEN: ${{ secrets.MCP_LIVE_TOKEN }}
        run: npm run test:chain:live
