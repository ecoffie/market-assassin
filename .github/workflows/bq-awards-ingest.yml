# BQ awards warehouse ingest — plan-only runner scaffold (Checkpoint B1).
# Manual dispatch only; no schedule until separately authorized.
# Does NOT run --apply, create exports, or download archives beyond the existing dry-run watermark read.
name: BQ awards ingest (plan only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bq-awards-ingest
  cancel-in-progress: false

jobs:
  plan:
    name: Dry-run ingest plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require configured secret names
        run: |
          if [ -z "${{ secrets.GCP_SA_JSON }}" ]; then
            echo "Missing required GitHub secret: GCP_SA_JSON"
            echo "Configure GCP_SA_JSON before dispatching a plan run."
            exit 1
          fi
          echo "Required secret name is configured (value is never printed)."

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 # v2.1.12
        with:
          credentials_json: ${{ secrets.GCP_SA_JSON }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Awards ingest dry-run (no --apply)
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          set -o pipefail
          npm run ingest:awards 2>&1 | tee /tmp/bq-awards-ingest-plan.log

      - name: Upload failure log (no ZIP/CSV)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bq-awards-ingest-plan-log
          path: /tmp/bq-awards-ingest-plan.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f /tmp/bq-awards-ingest-plan.log
          rm -rf "${{ runner.temp }}/bq-awards-ingest-work" 2>/dev/null || true
