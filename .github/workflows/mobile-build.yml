name: mobile-build
# Builds the Capacitor shell (mobile/) on every change to it.
# Android: debug APK artifact (installable on any phone for testing).
# iOS: unsigned simulator build (proves the Xcode project compiles).
# Store-signed builds (AAB / IPA) need signing secrets — see mobile/README.md.
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-build.yml']
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mindy-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  # PRs only: a second APK ("Mindy Preview") that loads this PR's Vercel preview instead of
  # getmindy.ai, so web-side changes (e.g. native sign-in) can be tested before merging.
  android-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Point the app at this PR's Vercel preview
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          node scripts/set-server-url.mjs "https://market-assassin-git-${SLUG}-eric-coffies-projects.vercel.app"
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mindy-android-PREVIEW-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx cap sync ios
      - run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
