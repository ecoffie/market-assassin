<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindy Map</title>
<link rel="icon" type="image/png" href="/brand/mindy-logo-icon.png"/>
<link rel="apple-touch-icon" href="/brand/mindy-logo-icon.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{
    --ink:#111c26; --sub:#6b7787; --faint:#9aa5b3;
    --line:#e6eaef; --hair:#f0f3f7; --bg:#fff; --wash:#f7f9fb;
    --jan:#3b82f6; --grnd:#22a06b; --fac:#8b5cf6; --maint:#f59e0b;
    --con:#ef4444; --ae:#0ea5e9; --it:#14b8a6; --sec:#64748b;
    --train:#a855f7; --health:#ec4899; --heavy:#78716c; --dla:#0284c7;
    --paint:#e11d48; --pest:#84cc16; --fence:#0891b2; --demo:#b45309;
    --sam:#137a4e; --recomp:#b45309; --forecast:#7c3aed; --dlac:#0369a1; --sbir:#7c3aed; --grantc:#047857;
    --hot:#d92d20; --warm:#b54708; --cool:#175cd3;
    --score:#0f2233; --gold:#f5b400; --pos:#12805c; --fire:#ff7a45;
    --disp:"Space Grotesk",system-ui,sans-serif; --ui:"Inter",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --sh1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --sh2:0 4px 8px -2px rgba(16,24,40,.1),0 2px 4px -2px rgba(16,24,40,.06);
    --sh3:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;min-height:100%}
  body{font-family:var(--ui);color:var(--ink);background:var(--bg);overflow:hidden;
    -webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .app{display:grid;grid-template-columns:392px minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);
    height:100vh;height:100dvh;min-height:560px;overflow:hidden;
    transition:grid-template-columns .26s cubic-bezier(.4,0,.2,1)}
  .app.collapsed{grid-template-columns:0px minmax(0,1fr)}
  .app.collapsed .panel{opacity:0;pointer-events:none}
  .panel{transition:opacity .18s}
  /* sidebar collapse handle — sits above the map, outside Leaflet's panes */
  .railbtn{position:fixed;top:50%;transform:translateY(-50%);z-index:1200;
    left:392px;width:28px;height:56px;border:1px solid var(--line);border-left:none;
    border-radius:0 10px 10px 0;background:#fff;color:var(--ink);cursor:pointer;
    font-size:18px;line-height:1;box-shadow:var(--sh2);display:grid;place-items:center;
    padding:0;transition:left .26s cubic-bezier(.4,0,.2,1),background .13s}
  .railbtn:hover{background:var(--wash)}
  .app.collapsed ~ .railbtn,.railbtn.collapsed{left:0}

  /* ============ LEFT PANEL ============ */
  .panel{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;background:#fff}

  /* header */
  .phead{padding:16px 20px 0;flex:none}
  .brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.35px}
  .badge-sd{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;
    color:var(--sam);background:#e7f4ee;border:1px solid #bfe3d3;padding:3px 7px;border-radius:5px}
  .sumline{font-size:13px;color:var(--sub);margin-top:5px}
  .sumline b{color:var(--ink);font-weight:600}

  /* filter bar (sticky, Airbnb-style pills) */
  .fbar{padding:12px 20px 10px;flex:none;border-bottom:1px solid var(--line);background:#fff}
  .fscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .fscroll::-webkit-scrollbar{display:none}
  .fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;
    color:var(--ink);background:#fff;border:1px solid #d5dbe3;border-radius:999px;padding:7px 13px;
    cursor:pointer;transition:.13s;white-space:nowrap}
  .fbtn:hover{border-color:var(--ink);box-shadow:var(--sh1)}
  .fbtn.active{background:var(--ink);border-color:var(--ink);color:#fff}
  .fbtn .cnt{font-family:var(--mono);font-size:10.5px;opacity:.65}
  .fbtn .car{font-size:9px;opacity:.5;transition:.2s}
  .fbtn.open .car{transform:rotate(180deg)}
  .clr{flex:none;font-size:12.5px;font-weight:500;color:var(--sub);background:none;border:none;
    text-decoration:underline;cursor:pointer;padding:7px 4px;white-space:nowrap}
  .clr:hover{color:var(--ink)}

  /* dropdown sheet */
  .sheet{display:none;padding:12px 0 4px;border-top:1px solid var(--hair);margin-top:11px}
  .sheet.show{display:block}
  .sheet h5{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);margin:0 0 9px}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .opt{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:7px;cursor:pointer;
    font-size:13px;transition:.1s;user-select:none}
  .opt:hover{background:var(--wash)}
  .cbx{width:16px;height:16px;border-radius:4px;border:1.5px solid #cbd3dc;flex:none;
    display:grid;place-items:center;transition:.12s;background:#fff}
  .opt.on .cbx{background:var(--ink);border-color:var(--ink)}
  .cbx svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:.1s}
  .opt.on .cbx svg{opacity:1}
  .opt .swatch{width:8px;height:8px;border-radius:50%;flex:none}
  .opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .sheetfoot{display:flex;gap:8px;padding:10px 0 2px;border-top:1px solid var(--hair);margin-top:8px}
  .sfb{flex:1;font-size:12.5px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .sfb.pri{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* sort row */
  .sortrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 20px;flex:none;border-bottom:1px solid var(--line)}
  .rescount{font-size:13px;font-weight:600}
  .rescount span{font-weight:400;color:var(--sub)}
  .sortsel{font-family:var(--ui);font-size:12.5px;font-weight:500;color:var(--ink);border:1px solid #d5dbe3;
    border-radius:8px;padding:6px 26px 6px 10px;cursor:pointer;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M3 4.5L6 8l3-3.5' stroke='%236b7787' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>") no-repeat right 8px center;
    -webkit-appearance:none;appearance:none}

  /* ============ LISTING CARDS ============ */
  .feed{flex:1;overflow-y:auto;padding:12px 16px 28px;scroll-behavior:smooth}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:12px;cursor:pointer;transition:box-shadow .16s,border-color .16s,transform .16s}
  .card:hover,.card.hot-hover{box-shadow:var(--sh3);border-color:#cfd7e0;transform:translateY(-1px)}
  .card.sel{border-color:var(--ink);box-shadow:0 0 0 2px rgba(17,28,38,.09),var(--sh2)}

  /* accent strip = category */
  .cstrip{height:3px;width:100%}

  .cbody{padding:13px 15px 14px}
  /* DECISION-CARD hero — the estimate leads, like a Zillow price (Eric 2026-08-03). The number is the
     biggest thing on the card; badges + title sit under it. Open/forecast = green M-Estimate tint;
     recompete = amber (real contract value); pending = neutral. */
  .chero{border:1px solid var(--grnd-line,#cfe9d9);border-radius:11px;padding:8px 13px;margin-bottom:11px;
    background:linear-gradient(150deg,#eef8f1,#f6fbf8)}
  .chero.recomp{border-color:#f0d9b5;background:linear-gradient(150deg,#fffaf2,#fff7ee)}
  /* forecast hero = violet tint (the agency's real published range, no ≈) — sibling to recompete's amber */
  .chero.fore{border-color:#e4dcff;background:linear-gradient(150deg,#f6f2ff,#faf8ff)}
  .chero.fore .cval{color:var(--forecast,#7c5cff)}
  .chero.pending{border-color:var(--hair);background:linear-gradient(150deg,#f5f7fa,#fafbfc)}
  /* Estimate leads, but must not out-shout the title (Eric 2026-08-04): hero ~18% shorter,
     value 29→25px so the eye reads identity → number → title, not number first. */
  .chero .cval{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:-.7px;color:var(--ink);
    line-height:1;font-variant-numeric:tabular-nums}
  .chero .cval .apx{font-size:17px;color:var(--faint);font-weight:700;vertical-align:1px}
  .chero .cval.pend{font-size:17px;font-weight:700;color:var(--faint);letter-spacing:-.2px}
  /* row 1: source chip + deadline pill */
  .crow1{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.07em;
    padding:3px 7px;border-radius:5px;text-transform:uppercase}
  .chip.SAM{background:#e7f4ee;color:var(--sam)}
  .chip.RECOMPETE{background:#fdf1e3;color:var(--recomp)}
  .chip.DLA{background:#e4f1fb;color:var(--dlac)}
  .chip.SBIR{background:#f0ebfd;color:var(--sbir)}
  .chip.GRANTS{background:#dcfce7;color:var(--grantc)}
  /* Company/contractor chip — soft purple tint, SAME family as the Open/Recompete chips above
     (Eric 2026-07-28: the company card read heavier/flatter because its lead chip was a SOLID
     strip-colored label while every other card's lead chip is a soft tinted pill). */
  .chip.CO{background:#f0ebfd;color:#7c3aed}
  /* Set-aside chip on a company card — light blue tint, distinct from the purple CO chip so an
     8(a)/SDVOSB/WOSB firm's eligibility reads at a glance without another solid badge. */
  .chip.sa{background:#eef4ff;color:var(--cool)}
  /* Gov-buyer role chips (Eric 2026-07-28 card-parity): the person's real contact_title leads the
     card. Contracting AUTHORITY (KO / Contracting Officer) gets the red decision-maker tint so the
     person who can actually award pops; every other role gets the neutral blue role chip. */
  .chip.ko{background:#fdecec;color:var(--hot)}
  .chip.role{background:#eef4ff;color:var(--cool)}
  .chip.docs{background:#eef0f3;color:var(--sub)}
  /* Early-signal: this office posts sources-sought/presolicitation, i.e. you can
     still shape the requirement. Green = go build the relationship. */
  .chip.early.high{background:#dcfae6;color:#12805c}
  .chip.early.medium{background:#eef7f3;color:#3f7a66}
  .dl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
    padding:3px 8px;border-radius:999px;margin-left:auto}
  .dl.hot{background:#fef3f2;color:var(--hot)}
  .dl.warm{background:#fffaeb;color:var(--warm)}
  .dl.cool{background:#eff8ff;color:var(--cool)}
  /* Company signal pill (right-aligned, dot). "Active vendor" — grounded: every firm on the
     Companies map provably holds real federal awards, so the presence dot is true, not decorative.
     Gives the company card the same right-aligned signal the Open (Due today) / Recompete
     (Expiring soon) cards carry. (Eric 2026-07-28 card-parity pass.) */
  .dl.co{background:#f0ebfd;color:#7c3aed}
  .dl.dead{background:#f2f4f7;color:var(--faint)}
  .dl i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}

  /* title */
  .ctitle{font-family:var(--disp);font-weight:700;font-size:15.5px;line-height:1.32;
    letter-spacing:-.2px;margin-bottom:7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* agency + location line */
  .cmeta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:11px}
  .cmeta .ag{font-weight:600;color:var(--ink)}
  .cmeta .ind{font-weight:600;color:var(--recomp);text-transform:uppercase;letter-spacing:.3px;font-size:11px}
  .cmeta .dot{width:3px;height:3px;border-radius:50%;background:#cbd3dc;flex:none}
  .cmeta .loc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmeta .loc.noloc{color:var(--faint);font-style:italic}

  /* the value strip — Zillow-style stat row */
  .stats{display:flex;align-items:stretch;gap:0;background:var(--wash);border:1px solid var(--hair);
    border-radius:10px;overflow:hidden;margin-bottom:11px}
  .st{flex:1;padding:8px 10px;min-width:0}
  .st + .st{border-left:1px solid #e8edf2}
  .st .k{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);margin-bottom:3px}
  .st .v{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st .v.sd{color:var(--sam)}
  .st .v.money{font-family:var(--disp);font-size:15px}
  .st .v.hi{color:var(--pos)} .st .v.med{color:var(--warm)}

  /* ---------- Opportunity DNA (Eric 2026-08-03, tasks/EPIC-opportunity-dna.md) ----------
     Two languages, never crossed: IDENTITY = typography (agency = a brand, the WORD carries it,
     one calm Landmark anchor) · BEHAVIOR = lucide icons (reserved for signals, never agencies).
     NO emoji (de-vibe rule). Lifecycle = the category header, not a badge. */
  .lchdr{display:flex;align-items:center;gap:8px;padding:9px 15px;border-bottom:1px solid var(--hair);
    font-family:var(--sans);font-weight:800;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .lchdr .lcdot{width:6px;height:6px;border-radius:50%;flex:none}
  .lchdr.open{color:var(--grnd,#0f9d58)} .lchdr.open .lcdot{background:var(--grnd,#0f9d58)}
  .lchdr.recomp{color:var(--recomp,#b26a00)} .lchdr.recomp .lcdot{background:var(--recomp,#b26a00)}
  .lchdr.fore{color:var(--forecast,#7c5cff)} .lchdr.fore .lcdot{background:var(--forecast,#7c5cff)}
  .lchdr .lcwhen{margin-left:auto;font-weight:600;font-size:10.5px;letter-spacing:.01em;text-transform:none;color:var(--faint)}
  /* Popup lifecycle header (Eric 2026-08-04, "make it the strongest visual — very Apple"): the
     horizon drops to its OWN quiet line under the label instead of riding the far right, so the
     header reads "● OPEN NOW / 3 days left". Popup-scoped so the compact result-list card header
     (same .lchdr) keeps its single-strip rhythm. */
  .pv .lchdr{flex-wrap:wrap}
  .pv .lchdr .lcwhen{margin-left:0;flex-basis:100%;padding-left:14px;margin-top:2px;font-size:11px}
  /* identity line: agency typography + one behavior icon */
  .idrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
  .agid{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:800;
    font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
  .agid .dnaic{width:13px;height:13px;color:var(--faint);flex:none}
  .beh{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-weight:700;font-size:11px;
    padding:4px 8px 4px 6px;border-radius:7px;white-space:nowrap}
  .beh .dnaic{width:12px;height:12px;flex:none}
  .beh.sbf{background:var(--grnd-bg,#ecf8f1);color:var(--grnd-deep,#137a4e);border:1px solid var(--grnd-line,#cfe9d9)}
  /* STORY beside the identity ("Army · Repeat Buyer") — same uppercase family as the agency but a
     calmer weight/color so the identity reads FIRST and the behavioral story trails as context. */
  .story{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:700;
    font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--grnd-deep,#137a4e)}
  .story .middot{color:var(--faint);font-weight:600}
  svg.dnaic{stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  /* fit chips — the approved card artifact: green "check" chips below the buyer line, only when true */
  .fitrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
  .fit{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-weight:600;font-size:12.5px;
    padding:7px 11px 7px 9px;border-radius:9px;white-space:nowrap;
    background:var(--grnd-bg,#ecf8f1);color:var(--grnd-deep,#137a4e);border:1px solid var(--grnd-line,#cfe9d9)}
  .fit .fitic{width:13px;height:13px;flex:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}

  /* footer: solicitation + actions */
  .cfoot{display:flex;align-items:center;gap:8px}
  .solno{font-family:var(--mono);font-size:11px;color:var(--faint);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .act{font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;text-decoration:none;
    border:1px solid var(--line);color:var(--ink);background:#fff;transition:.12s;white-space:nowrap;cursor:pointer}
  .act:hover{border-color:var(--ink);background:var(--wash)}
  .act.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .act.pri:hover{background:#233240}

  .empty{text-align:center;padding:48px 24px;color:var(--sub)}
  .empty h4{font-family:var(--disp);font-size:16px;color:var(--ink);margin-bottom:6px}
  .empty p{font-size:13.5px;line-height:1.5}
  .empty button{margin-top:14px;font-size:13px;font-weight:600;padding:9px 16px;border-radius:9px;
    background:var(--ink);color:#fff;border:none;cursor:pointer}

  /* ============ MAP ============ */
  .mapwrap{position:relative;min-width:0;min-height:0;display:flex;overflow:hidden}
  /* Map is a flex child with explicit sizing — no percentage-height chain to break. */
  #map{flex:1 1 auto;width:100%;min-height:0;align-self:stretch;background:#e8eef2}
  .leaflet-container{width:100%;height:100%;background:#e8eef2}
  .maptop{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:500;
    display:flex;gap:8px;align-items:center}
  .mpill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 15px;
    font-size:12.5px;font-weight:600;box-shadow:var(--sh2);cursor:pointer;transition:.13s;white-space:nowrap}
  .mpill:hover{box-shadow:var(--sh3)}
  .mpill.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Horizon legend — tiny, bottom-left (Eric 2026-08-03: "people love legends"). Dots = the exact
     pin colors. z-index under the bottom-center tile status (520) but above the tiles; bottom-right
     stays clear for the zoom control. Pointer-events off so it never eats a map drag. TWO variants:
     the Opportunity map shows horizons (srcColor / --grnd/--recomp/--forecast); the Network map
     shows entities (contactColorFor / purple #7c3aed, red #dc2626). body.is-network swaps groups. */
  .maplegend{position:absolute;left:12px;bottom:12px;z-index:500;pointer-events:none;
    display:flex;align-items:center;background:rgba(255,255,255,.94);
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;box-shadow:var(--sh2)}
  .maplegend .lg-grp{display:flex;align-items:center;gap:13px}
  .maplegend .lg{display:inline-flex;align-items:center;gap:6px;
    font:600 11px Inter,system-ui,sans-serif;color:var(--ink);white-space:nowrap}
  .maplegend .lg i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
  /* one group per map — swap on body.is-network (never both, never neither) */
  .maplegend .lg-net{display:none}
  body.is-network .maplegend .lg-opps{display:none}
  body.is-network .maplegend .lg-net{display:flex}

  /* tile load status */
  .tilestatus{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:520;
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;
    font-size:12.5px;font-weight:500;color:var(--sub);box-shadow:var(--sh2);max-width:78%;
    text-align:center;display:none}
  .tilestatus.err{color:#b42318;border-color:#fecdc9;background:#fffbfa}

  .marker-hover{z-index:1000!important}

  /* popup — Google Maps style */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--sh3);padding:0;overflow:hidden;border:1px solid var(--line)}
  .leaflet-popup-content{margin:0!important;width:296px!important;line-height:1.45}
  .leaflet-popup-tip{box-shadow:var(--sh2)}
  .pv{font-family:var(--ui)}
  .pv .pvstrip{height:4px}
  .pv .pvbody{padding:14px 15px 15px}
  .pv .pvchips{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
  /* Title clamped to TWO lines (Eric 2026-08-04) so every card shares an identical rhythm —
     a long open-opp title can't wrap to 3-4 lines and break the sibling look. */
  .pv .pvt{font-family:var(--disp);font-weight:700;font-size:16.5px;line-height:1.28;
    letter-spacing:-.25px;color:var(--ink);margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pv .pvmeta{font-size:13px;color:var(--sub);margin-bottom:12px}
  .pv .pvmeta b{color:var(--ink);font-weight:600}

<script>
// TODAY = the viewer's ACTUAL local date, anchored to noon so day-diff math (daysOut / postedAgo /
// "closes today") never crosses a boundary due to time-of-day. This WAS hardcoded to 2026-07-21 (a
// prototype build-time date) — which made every card compute "days left" / "posted N days ago"
// against a frozen July 21, so a real Jul-21 opp read "posted today" and the drawer disagreed with
// the card. Now live. (2026-07-27 date-consistency bug.)
const TODAY=(function(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate(),12,0,0);})();

// ---------- lookups ----------
const CATCOL={"Janitorial":"--jan","Grounds/Landscaping":"--grnd","Facility Support":"--fac",
 "Facility Maint":"--maint","Construction/Reno":"--con","Engineering/A&E":"--ae",
 "HVAC/Mechanical":"--maint","Roofing/Exterior":"--con","Electrical":"--ae","IT Services":"--it",
 "Security Guard":"--sec","Training":"--train","Healthcare":"--health","Heavy Civil":"--heavy",
 "DLA Supply/Parts":"--dla","Painting":"--paint","Pest Control":"--pest",
 "Fencing/Security":"--fence","Demolition/Abatement":"--demo"};
const AGENCY={VA:"Veterans Affairs",DoD:"Dept of Defense",GSA:"General Services Admin",
 USDA:"Dept of Agriculture",DHS:"Homeland Security",DOI:"Dept of the Interior",
 DOE:"Dept of Energy",DOJ:"Dept of Justice",DOT:"Dept of Transportation",
 HHS:"Health & Human Services","HHS/FDA":"HHS — FDA",State:"Dept of State",AF:"Air Force",
 Navy:"Navy",Army:"Army",USACE:"Army Corps of Engineers",USSF:"Space Force",DLA:"Defense Logistics",
 Commerce:"Dept of Commerce",AOC:"Architect of the Capitol",IBWC:"Intl Boundary & Water Comm",
 USAGM:"US Agency for Global Media","DoD/Army":"Dept of Defense — Army",SSA:"Social Security Admin",
 "DHS/USCG":"Homeland Security — Coast Guard","USDA/FS":"Agriculture — Forest Service",
 DoDEA:"DoD Education Activity","DOI/NPS":"Interior — National Park Service"};
const SETFULL={SDVOSB:"Service-Disabled Veteran-Owned",SB:"Small Business",
 "8(a)":"8(a) Competed",EDWOSB:"Economically Disadv. WOSB",WOSB:"Women-Owned Small Business",
 "Veteran SA":"Veteran-Owned",ISBEE:"Indian Small Business",
 "Buy Indian":"Buy Indian Set-Aside",None:"Open / unrestricted","":"—"};
const SETGROUPS=[
 {key:"SDVOSB",label:"SDVOSB",col:"--grnd",match:s=>s==="SDVOSB"||s==="Veteran SA"},
 {key:"SB",label:"Small Business",col:"--jan",match:s=>s==="SB"},
 {key:"8(a)",label:"8(a)",col:"--fac",match:s=>s==="8(a)"},
 {key:"EDWOSB",label:"WOSB / EDWOSB",col:"--con",match:s=>s==="EDWOSB"||s==="WOSB"},
 {key:"Other",label:"Other set-aside",col:"--train",match:s=>["ISBEE","Buy Indian"].includes(s)},
 {key:"None",label:"Unrestricted",col:"--sec",match:s=>s==="None"||s===""}];
const SRCLABEL={SAM:"Open on SAM",RECOMPETE:"Target",DLA:"DLA supply",SBIR:"SBIR/STTR",FORECAST:"Forecast",GRANTS:"Grant"};

function cv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function catColor(c){return cv(CATCOL[c]||"--sec");}
// Pin/card color by SOURCE: RECOMPETE=amber, SBIR=purple (a distinct source, like DLA), else by category.
function srcColor(o){/* PIN COLOR = TIME HORIZON only (Eric 2026-07-30, map-as-app): open=green, recompete=amber, forecast=violet. SOURCE (SAM/DLA/SBIR/Grants) is NOT a color — it lives in the source filter + card, so the map stays calm and scales to any number of sources. SBIR used to be violet (a source cue); it is an OPEN opp, so it is now green like every other open pin. */return o.src==='RECOMPETE'?cv('--recomp'):(o.src==='FORECAST'?cv('--forecast'):cv('--grnd'));}
function setKey(s){for(const g of SETGROUPS)if(g.match(s))return g.key;return "None";}
// Compact money for the DECISION-CARD hero (Eric 2026-08-03: the card leads with the number, like a
// Zillow price). "$4.9M" / "$540K" — same rounding the map PIN uses (mCompact), so the tag on the pin
// and the hero on the card always agree. n<=0 / not-finite → '' (caller shows "Estimate Pending" —
// NEVER a fabricated number, mirroring value-range.ts's ≥8-comps-or-nothing contract).
function estMoney(n){n=Number(n);if(!isFinite(n)||n<=0)return '';
  if(n>=1e9)return '$'+(n/1e9).toFixed(n%1e9?1:0).replace(/\.0$/,'')+'B';
  if(n>=1e6)return '$'+(n/1e6).toFixed(n%1e6?1:0).replace(/\.0$/,'')+'M';
  if(n>=1e3)return '$'+Math.round(n/1e3)+'K';
  return '$'+Math.round(n);}
// The estimate HERO block that leads every open-opp / forecast card. The ≈ is the one honest glyph
// that says "estimate, not a quoted price" (Eric: Zillow shows a price, ours is an estimate). No
// "M-Estimate" label on the card — the branding + methodology live in the LISTING. RECOMPETE rows
// lead with the real CONTRACT VALUE (o.value, a firm number) instead — labeled honestly, no ≈.
// No grounded value (<8 comps → o.est falsy) → a quiet "Estimate Pending", never a fake number.
function cardHero(o){
  if(o.src==='RECOMPETE'){
    var cv=(o.value&&String(o.value).trim())?String(o.value):'';
    return cv
      ? '<div class="chero recomp"><div class="cval">'+cv+'</div></div>'
      : '<div class="chero pending"><div class="cval pend">Value on file at SAM</div></div>';
  }
  // FORECAST leads with the AGENCY's OWN published estimate — a REAL government figure, so NO ≈
  // glyph (Eric 2026-08-04: "the forecast should have real numbers not modeled"). The ≈ is
  // reserved for an OPEN opp's MODELED estimate. estRange is verbatim from agency_forecasts
  // (e.g. "$5M - $9.9M"); '' when the agency published nothing → an honest "Estimate pending".
  if(o.src==='FORECAST'){
    var er=(o.estRange&&String(o.estRange).trim())?String(o.estRange):'';
    return er
      ? '<div class="chero fore"><div class="cval">'+esc(er)+'</div></div>'
      : '<div class="chero pending"><div class="cval pend">Estimate pending</div></div>';
  }
  var m=estMoney(o.est);
  return m
    ? '<div class="chero"><div class="cval"><span class="apx">≈ </span>'+m+'</div></div>'
    : '<div class="chero pending"><div class="cval pend">Estimate Pending</div></div>';
}
function dueDate(o){return o.src==='RECOMPETE'?o.exp:o.close;}
// Anchor the due date to local NOON (matching TODAY) so the day-diff is a clean integer, not
// offset by a midnight-vs-noon half day that Math.round could flip. dueDate is a YYYY-MM-DD string.
function daysOut(o){var d=String(dueDate(o)||'').slice(0,10); if(!d)return NaN; return Math.round((new Date(d+'T12:00:00')-TODAY)/864e5);}
function valNum(o){ // for sorting
  if(!o.value)return -1;
  const m=o.value.match(/([\d.]+)\s*([KM])/i);if(!m)return -1;
  return parseFloat(m[1])*(m[2].toUpperCase()==='M'?1e6:1e3);
}
function fmtDays(d,isRecompete){
  // RECOMPETE rows measure "days out" against the CONTRACT EXPIRATION. These are LIVE
  // subcontracting + recompete opportunities, never dead/expired notices — so the status
  // language INVITES pursuit ("Recompete now", "subcontract"), and never uses 'dead'/greyed
  // styling or the words "Expired"/"Closed" (which read as unavailable). The Expires DATE still
  // shows in its own field (it's the selling point — this comes up for rebid), but the STATUS
  // pill frames the card as an opportunity.
  if(isRecompete){
    // The dataset tab is already named "Recompetes" — so the pill must NOT echo it (Eric 2026-07-27:
    // "the cards still say recompetes at the top"). It carries the TIMING the Expires date can't flag
    // at a glance: how close the rebid is. (The recompete FRAME is the tab; the pill = urgency only.)
    // PAST-EXPIRY is honest here: a contract whose end already passed did NOT "expire now" — it
    // EXPIRED, the recompete already left (Eric 2026-07-27, the NRWA case). The default view filters
    // these out (recompete-map ?includePast); this label covers the ones that surface via favorites /
    // saved search / deep link so they never read as a live window.
    if(d<0)return{t:'Expired',c:'cool'};                    // end date already passed → recompete gone
    if(d<=90)return{t:'Expiring soon',c:'warm'};            // rebid within ~90 days — the sweet spot
    return{t:'Active — subcontract',c:'cool'};              // still running → pursue as a sub today
  }
  if(d<0)return{t:'Closed',c:'dead'};
  if(d===0)return{t:'Due today',c:'hot'};
  if(d===1)return{t:'1 day left',c:'hot'};
  if(d<=3)return{t:d+' days left',c:'hot'};
  if(d<=7)return{t:d+' days left',c:'warm'};
  return{t:d+' days left',c:'cool'};
}
// Noon-anchor the calendar date so a UTC-midnight / date-only value doesn't shift a day in US zones.
function longDate(d){var s=String(d||'').slice(0,10); if(!s)return ''; return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
// Card-cell date: DROP the year ONLY when it's the current year (keeps near-term cells compact), but
// ALWAYS show it otherwise. Eric 2026-07-27: a card read "Expires Apr 30" with no year on a contract
// whose follow-on runs to 2030 — ambiguous 2026-vs-2027-vs-2030, and the year is load-bearing on a
// recompete. Blanket-stripping ", 2026" was wrong the moment a date wasn't in 2026. '' if undated.
function shortDate(d){var s=String(d||'').slice(0,10); if(!s)return ''; var dt=new Date(s+'T12:00:00');
  if(isNaN(dt))return ''; var y=dt.getFullYear();
  // Show the year UNLESS it's the current year AND still in the future (compact for near-term rows).
  // A PAST date always shows its year so an expired contract can't read as this-year-and-fine.
  var compact = (y===TODAY.getFullYear()) && (dt>=TODAY);
  return dt.toLocaleDateString('en-US', compact?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'});}
// "Posted 3 days ago" freshness (Zillow's "12 minutes ago" badge). Uses the CALENDAR date vs TODAY
// (both local noon) so it can't read "posted today" for a day-old opp. '' if undated.
function postedAgo(v){ var s=String(v||'').slice(0,10); if(!s)return ''; var t=Date.parse(s+'T12:00:00'); if(!isFinite(t))return '';
  var days=Math.floor((TODAY-t)/864e5); if(days<0)days=0;
  if(days===0)return 'Posted today'; if(days===1)return 'Posted 1 day ago';
  if(days<30)return 'Posted '+days+' days ago';
  var mo=Math.floor(days/30); return 'Posted '+mo+' month'+(mo===1?'':'s')+' ago'; }
// Real award TYPE label for an Awarded card (IDIQ vehicle / Task order / …) from contract_type —
// the UNIQUE lead badge, replacing the identical "Target" every recompete card used to show.
// Mirrors contractTypeLabel() in the drawer JS; kept inline because template.html has its own scope.
function awardTypeBadge(ct){ var t=String(ct||'').toUpperCase().trim(); if(!t)return '';
  if(t.indexOf('IDV')>=0||t.indexOf('IDIQ')>=0||t.indexOf('INDEFINITE')>=0||t==='GWAC'||t==='BPA')return 'IDIQ vehicle';
  if(t.indexOf('DELIVERY ORDER')>=0||t.indexOf('TASK ORDER')>=0)return 'Task order';
  if(t.indexOf('BPA CALL')>=0)return 'BPA call';
  if(t.indexOf('PURCHASE ORDER')>=0)return 'Purchase order';
  if(t.indexOf('DEFINITIVE')>=0)return 'Definitive contract'; return ''; }
// The card's LEAD badge = UNIQUE per-card info, NOT a repeated dataset label (the section header +
// the card's color strip already say the dataset — Eric/Zillow 2026-07-27). Open → posted freshness;
// Awarded → the real award type. Falls back to the source label only if the unique field is absent.
function cardBadge(o){
  if(o.src==='RECOMPETE'){ var at=awardTypeBadge(o.contractType); return at||''; }
  var pa=postedAgo(o.posted); return pa||'';
}
// EARLY-SIGNAL chip — does this office telegraph work BEFORE it hits the street?
// Scored per buying office (the DoDAAC that prefixes the solicitation number):
// 46 offices are >=50% early while 115 post ZERO early notices, so the
// department average (21.2%) describes almost nobody. The behavioural read is
// the product: 'high' → the requirement can still be shaped, go build the
// relationship; low/none → nothing to influence, just bid it when it posts.
// Only high/medium earn a chip — "this office never posts early" is not news on
// every card, and a chip on 470 offices would be wallpaper.
function earlySignalChip(o){
  if(o.earlySignal!=='high'&&o.earlySignal!=='medium')return '';
  var t=o.earlySignal==='high'?'Posts early':'Sometimes early';
  // Percent goes in the tooltip, not the label: the rate moves ~10.7 points
  // between periods, so a precise number on the card would imply false accuracy.
  var pct=typeof o.earlySignalPct==='number'?o.earlySignalPct+'% of this office’s notices are sources-sought or presolicitation — the window where you can still shape the requirement.':'';
  return '<span class="chip early '+o.earlySignal+'" title="'+pct+'">'+t+'</span>';
}
function samURL(o){return 'https://sam.gov/search/?keywords='+encodeURIComponent(o.sol);}
// A RECOMPETE row is one of TWO plays (Eric 2026-07-27): a still-running TASK ORDER under a live
// IDIQ → you can't prime it now, so the play is SUBCONTRACT to the incumbent today; vs an EXPIRING
// prime award → get ahead of the RECOMPETE and bid it next cycle. fmtDays' 'cool' bucket
// ("Active — subcontract") is exactly the subcontract case; 'warm'/'hot' is the recompete case.
function recompetePlay(o){
  if(o.src!=='RECOMPETE')return null;
  var f=fmtDays(daysOut(o),true);
  return f.c==='cool'?'subcontract':'recompete';
}
function draftURL(o){

// ---------- state ----------
// CATS + the src facet list are DYNAMIC — the Opportunities map merges 5 sources (SAM/DLA/SBIR
// opens + FORECAST + GRANTS) and their categories aren't known at SSR time. refreshFacets()
// (called after every fetch) unions any NEW src/cat found in the live OPPS into the filter sets,
// SELECTED by default — otherwise pass()'s `F.src.has`/`F.cat.has` checks silently reject every
// pin from a source the frozen sets never heard of (the bug that hid ALL DLA/Forecast/Grant pins:
// they loaded into OPPS but pass() dropped 100% of them). (Eric 2026-07-31.)
let CATS=[...new Set(OPPS.map(o=>o.cat))].sort((a,b)=>cnt('cat',b)-cnt('cat',a));
function cnt(k,v){return OPPS.filter(o=>k==='cat'?o.cat===v:k==='src'?o.src===v:setKey(o.set)===v).length;}
const ALL_SRC=["SAM","DLA","SBIR","FORECAST","GRANTS","RECOMPETE"];
const F={src:new Set(ALL_SRC),cat:new Set(CATS),set:new Set(SETGROUPS.map(g=>g.key)),
         sdOnly:false,soon:false,sort:''};
// Union any src/cat present in the live OPPS into the (selected) filter sets + refresh CATS, so a
// newly-loaded horizon renders instead of being silently filtered out. Only ADDS (never removes a
// user's deselection of a value that's still present). Safe to call every render.
function refreshFacets(){
  try{
    (OPPS||[]).forEach(function(o){ if(o&&o.src&&!F.src.has(o.src))F.src.add(o.src); });
    var live=[...new Set((OPPS||[]).map(function(o){return o.cat;}).filter(Boolean))];
    live.forEach(function(c){ if(!F.cat.has(c))F.cat.add(c); });
    CATS=live.sort(function(a,b){return cnt('cat',b)-cnt('cat',a);});
  }catch(e){}
}

function mountTiles(i){
  const p=PROVIDERS[i];
  if(tiles)map.removeLayer(tiles);

  setTileStatus('Loading '+p.name+' tiles…','load');

      else setTileStatus('Map tiles blocked by your network. Pins still work — try the basemap button.','err');

  const b=document.getElementById('basemapBtn');
  if(b)b.textContent=PROVIDERS[(i+1)%PROVIDERS.length].name;

// ---------- popup (Google-Maps style) ----------
// The map-pin POPUP speaks the SAME card language as the result-list card (Eric 2026-08-03,
// "identity first, size second"): it REUSES lcHeader / dnaRow / cardHero / fitChips so the pin,
// the card and the popup can never disagree. Order mirrors cardHTML exactly —
//   lifecycle header -> IDENTITY (dnaRow) -> value HERO (cardHero) -> chips -> title -> full-agency
//   meta -> fit chips -> facts -> solicitation -> CTAs.
// Three Eric decisions locked here:
//  1. DNA identity leads; the value comes SECOND (cardHero), never first.
//  2. RECOMPETE value is the REAL contract number (cardHero → o.value, NO ≈); only OPEN/forecast
//     get the ≈ M-Estimate band (cardHero → estMoney(o.est)). cardHero owns the ≈-glyph rule, so
//     the popup can't diverge from the card.
//  3. The "Current incumbent" line is DROPPED when the incumbent equals the card title (a recompete
//     row's title IS the incumbent → the line would just repeat the title). It shows ONLY when a
//     genuine, DIFFERENT incumbent exists on the row (case-insensitive, trimmed compare).
// The ONE context sentence (slot 5) — built ENTIRELY from the row's own fields, never AI (Eric
// 2026-08-04). Forecast: "Planned for <Q# FY####>" · Open: "Due <date> · Posted <date>" ·
// Recompete: "Incumbent expires <date>". Dates are Posted-style short dates that age well
// (Eric: "Posted 13 days ago ages poorly. Dates don't.").
function pvSentence(o){
  if(o.src==='RECOMPETE'){
    return o.exp ? '<b>Incumbent expires '+esc(longDate(o.exp))+'</b>' : '';
  }
  if(o.src==='FORECAST'){
    // timing rides o.cat as "Forecast · Q2 FY2026"; else the anticipated award date; else nothing.
    var t=String(o.cat||'').split('·').pop().trim();
    if(t && !/^forecast$/i.test(t)) return '<b>Planned for '+esc(t)+'</b>';
    return o.close ? '<b>Planned for '+esc(longDate(o.close))+'</b>' : '';
  }
  var due=o.close?('<b>Due '+esc(shortDate(o.close))+'</b>'):'';
  var posted=o.posted?('<span class="lbl">Posted '+esc(shortDate(o.posted))+'</span>'):'';
  return due && posted ? (due+' &middot; '+posted) : (due || posted);
}
// The single set-aside / context chip row (slot 5 tail). Open → the real set-aside (or "Open
// competition"). Forecast → "Open competition" + the "Not yet on SAM.gov" differentiator tag.
// Recompete → NOTHING (Eric 2026-08-04: removed "Win odds" — no competing scoring language on
// the card; win probability lives in the listing).
function pvSetRow(o){
  if(o.src==='RECOMPETE')return '';
  var hasSet=o.set && o.set!=='None' && o.set!=='NONE';
  if(o.src==='FORECAST'){
    var fpill=hasSet
      ? '<span class="setpill sd">'+esc(SETFULL[o.set]||o.set)+'</span>'
      : '<span class="setpill fore">Open competition</span>';
    return '<div class="pvsetwrap">'+fpill+'<span class="foretag">Not yet on SAM.gov</span></div>';
  }
  var opill=hasSet
    ? '<span class="setpill sd">'+esc(SETFULL[o.set]||o.set)+'</span>'
    : '<span class="setpill">Open competition</span>';
  return '<div class="pvsetwrap">'+opill+'</div>';
}

// ---------- listing card ----------
// ---------- Opportunity DNA helpers (Eric 2026-08-03, tasks/EPIC-opportunity-dna.md) ----------
// Minimal HTML-escape for the DNA text nodes (agency label, horizon date) — controlled server data,
// but escaped for hygiene since these go into innerHTML template strings.
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
// Lifecycle = the CATEGORY HEADER (like Zillow's status), not a badge. Open/Recompete/Forecast,
// matching the pin color. The "when" restates the horizon date it already carries.
function lcHeader(o){
  // FORECAST horizon = the anticipated timing (rides o.cat as "Forecast · Q2 FY2026"); drop the
  // "Forecast" prefix so the quiet line reads just "Q2 FY2026".
  var _ft=String(o.cat||'').split('·').pop().trim();
  var kind = o.src==='RECOMPETE' ? {c:'recomp',t:'Recompete',when:o.exp?('Expires '+shortDate(o.exp)):''}
    : (o.src==='FORECAST' ? {c:'fore',t:'Forecast',when:(_ft&&!/^forecast$/i.test(_ft))?_ft:''}
      : {c:'open',t:'Open now',when:o.posted?('Posted '+shortDate(o.posted)):''});
  return '<div class="lchdr '+kind.c+'"><span class="lcdot"></span>'+kind.t
    + (kind.when?'<span class="lcwhen">'+esc(kind.when)+'</span>':'') + '</div>';
}
// Identity + STORY on ONE line (Eric 2026-08-03: "identity → story → estimate", not
// "database → estimate → title"). The agency SHORT CODE (Army/VA/GSA) is the recognizable brand
// — one calm Landmark icon anchors it — followed by the buyer's STORY as "· <story>": the single
// STRONGEST behavioral signal, never a pile (Eric: "whichever is strongest"). Priority: a repeat
// buyer (o.repeat — prior awards in this NAICS; recompetes are repeat buys by definition) beats
// SB-friendly (o.sbf — the buyer's measured PO-share top band). Each is real/grounded (set in
// toRow) — never fabricated; when neither is true the line is just the identity.
function dnaRow(o){
  // Identity = SUB-agency ("Army"), NOT the parent dept ("Dept of Defense"); fall back to dept only
  // when subAgency is empty (~0.4% of pins). Both are clean()'d in toRow. (Eric 2026-08-03.)
  var ag = (o.subAgency && String(o.subAgency).trim()) ? String(o.subAgency) : (o.agency ? String(o.agency) : '');
  if(!ag) return '';
  var story = o.repeat ? 'Repeat Buyer' : (o.sbf ? 'SB-friendly' : '');
  var storyHTML = story ? '<span class="story"><span class="middot">·</span>'+esc(story)+'</span>' : '';
  return '<div class="idrow"><span class="agid"><svg class="dnaic" viewBox="0 0 24 24"><use href="#dna-landmark"/></svg>'+esc(ag)+'</span>'+storyHTML+'</div>';
}
// Fit chips (the approved card artifact, Eric 2026-08-03): a row of GREEN check chips below the buyer
// line — "Fits your NAICS · Repeat buyer · SB-friendly". Each renders ONLY when its real flag is
// true (never fabricated): o.fits (card NAICS ∈ the signed-in user's profile codes, server-set on
// the scope=profile path), o.repeat (this buyer has prior awards in this NAICS — recompete rows are
// repeat buys by definition; open opps get it from the agency+NAICS award history), o.sbf (buyer's
// measured PO-share top band). No chip is shown for a signal we can't ground → the row can be empty.
function fitChips(o){
  var c='';
  if(o.fits)   c+='<span class="fit"><svg class="fitic" viewBox="0 0 24 24"><use href="#dna-check"/></svg>Fits your NAICS</span>';
  if(o.repeat) c+='<span class="fit"><svg class="fitic" viewBox="0 0 24 24"><use href="#dna-check"/></svg>Repeat buyer</span>';
  if(o.sbf)    c+='<span class="fit"><svg class="fitic" viewBox="0 0 24 24"><use href="#dna-check"/></svg>SB-friendly</span>';
  return c?'<div class="fitrow">'+c+'</div>':'';
}
function cardHTML(o){
  const d=daysOut(o),f=fmtDays(d,o.src==='RECOMPETE'),col=srcColor(o);
  const agency=AGENCY[o.agency]||o.agency;
  const stats=o.src==='RECOMPETE'
   ?`<div class="st"><div class="k">Contract value</div><div class="v money">${o.value||'—'}</div></div>
     <div class="st"><div class="k">Win odds</div><div class="v ${o.prob==='high'?'hi':'med'}">${(o.prob||'—').replace(/^./,c=>c.toUpperCase())}</div></div>
     <div class="st"><div class="k">Expires</div><div class="v">${shortDate(o.exp)}</div></div>`
   :`<div class="st"><div class="k">Set-aside</div><div class="v ${o.set==='SDVOSB'?'sd':''}">${o.set==='None'?'Open':o.set}</div></div>
     <div class="st"><div class="k">NAICS</div><div class="v">${o.naics}</div></div>
     <div class="st"><div class="k">Due</div><div class="v">${shortDate(o.close)}</div></div>`;
  // The status pill only earns its place when the TIMING is genuinely actionable — otherwise it
  // just restates the Due/Expires date cell (Eric 2026-07-27: "same info said differently, no
  // value"; and "Recompete now on every card is not how Zillow does it" — Zillow shows the sold
  // date, not a verb stamped on every card). Show it ONLY when it adds a decision the date can't:
  //  - OPEN, genuinely urgent (f.c==='hot' → ≤3 days / due today) — a scannable "act now" flag; OR
  //  - a RECOMPETE in its ACTIONABLE window (f.c==='warm' → "Expiring now"/"Expiring soon") —
  //    the rebid is live/near, a strategic cue the Expires date alone doesn't convey.
  // The "Active — subcontract" majority (f.c==='cool') drops the pill; the Expires cell carries it.
  const showDl = f.c==='hot' || (o.src==='RECOMPETE' && f.c==='warm');
  // DNA order (Eric 2026-08-03, "identity → story → estimate", NOT "database → estimate → title"):
  //   lifecycle header (OPEN NOW) → IDENTITY+STORY line (Army · Repeat Buyer) → estimate hero
  //   (≈ $8.2M — no longer carrying identity) → title → location → facts (set-aside · due).
  // Docs chip REMOVED (Eric: "Docs doesn't belong on the card"). The fit-chip row is GONE too —
  // its Repeat/SB story moved UP onto the identity line (dnaRow), so a chip row below would just
  // repeat it. earlySignal + genuine-urgency pills still ride a slim row under the estimate.
  const crow = earlySignalChip(o) + (showDl?`<span class="dl ${f.c}"><i></i>${f.t}</span>`:'');
  return `${lcHeader(o)}<div class="cstrip" style="background:${col}"></div><div class="cbody">
    ${dnaRow(o)}
    ${cardHero(o)}
    ${crow?`<div class="crow1">${crow}</div>`:''}
    <div class="ctitle">${o.title}</div>
    <div class="cmeta">${o.src==='RECOMPETE'&&o.cat?'<span class="ind">'+o.cat+'</span><span class="dot"></span>':''}${o.noPin?('<span class="loc noloc">○ '+(o.noLoc||o.loc)+'</span>'):('<span class="loc">'+o.loc+'</span>')}</div>
    <div class="stats">${stats}</div>
    <div class="cfoot">
      <span class="solno">${o.noPin?'Forecast — not yet on SAM':o.sol}</span>
      <a class="act" href="${samURL(o)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">SAM.gov</a>
      <a class="act pri" href="${draftURL(o)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${draftCTA(o)}</a>
    </div></div>`;
}

// ---------- filtering + render ----------
function pass(o){
  if(!F.src.has(o.src))return false;
  if(!F.cat.has(o.cat))return false;
  if(!F.set.has(setKey(o.set)))return false;
  if(F.sdOnly&&setKey(o.set)!=='SDVOSB')return false;
  if(F.soon){const d=daysOut(o);if(d<0||d>7)return false;}
  return true;
}
// "Recommended" for OPEN opportunities — the Zillow-relevance blend (Eric 2026-07-28: the default was
// just "soonest deadline", one dimension wearing the Recommended label — same gap the Companies sort
// had). A transparent blend of REAL opp fields, NONE fabricated, higher = more recommended:
//   • urgency — an opp closing in the actionable window (days-out) is timely, but past its window it
//     DROPS (a due-tomorrow opp you can't realistically bid isn't "recommended"); ~2-8 weeks out peaks.
//   • freshness — a recently POSTED opp beats a stale one (more likely still real + full runway).
//   • set-aside relevance — an opp with a set-aside a small biz can pursue gets a boost.
//   • value — the M-Estimate (o.est), LOG-scaled so a big opp counts without swamping a fitting small one.
//   • docs — a real pulled solicitation package (o.docs) is more biddable than a bare notice.
// All terms ~0..1, weighted. RECOMPETE rows are NOT scored here (different semantics — they keep the
// deadline order); this only re-ranks the Open/SAM default view.
function oppRecommendedScore(o){
  var d=daysOut(o); // days until the response deadline (NaN if none)
  // Urgency: peaks in the 3–45 day pursue window; a past/at-0 deadline or a far-off one scores lower.
  var urgency;
  if(!isFinite(d)) urgency=0.3;                       // no deadline → neutral-low
  else if(d<0) urgency=0.05;                          // already closed → almost out
  else if(d<=3) urgency=0.55;                         // very soon — urgent but hard to start
  else if(d<=45) urgency=1;                           // the sweet spot — time to actually bid
  else if(d<=90) urgency=0.7;
  else urgency=0.45;                                  // far out — real but not pressing
  // Freshness: posted within ~7 days = full credit, decaying to ~0 by 60 days old.
  var pd=String(o.posted||'').slice(0,10);
  var ageDays=pd?Math.max(0,Math.round((TODAY-new Date(pd+'T12:00:00'))/864e5)):45;
  var freshness=Math.max(0,1-ageDays/60);
  // Set-aside relevance: a real set-aside (not "None") a small business can pursue.
  var setAside=(o.set&&o.set!=='None'&&o.set!=='Open')?1:0;
  // Value: log-scaled M-Estimate median (o.est), ~$10K→0 .. ~$100M→1. No estimate → 0 (never fabricated).
  var v=Number(o.est)||0;
  var valTerm=v>0?Math.min(1,Math.max(0,(Math.log10(v)-4)/5)):0;
  var docs=o.docs?1:0;
  return 0.40*urgency + 0.24*freshness + 0.16*setAside + 0.12*valTerm + 0.08*docs;
}
// "Recommended" for RECOMPETES — the relevance blend (Eric 2026-07-28: the default was just "soonest
// expiration", one dimension). A recompete is a rebid/subcontract target; the blend surfaces the ones
// worth CHASING, all from real row fields (win-probability isn't threaded to the map pin, so it's a
// queued fast-follow — NOT fabricated here):
//   • window timing — the ACTIONABLE recompete window is ~6–18 months before expiry (agencies post
//     the follow-on 6–18mo out). An expiry in that window peaks; already-expired or far-off scores low.
//   • contract-type actionability — a TASK ORDER / DELIVERY ORDER (a small firm can sub it NOW) or a
//     small-buy (BPA call / purchase order) outranks a giant parent IDIQ vehicle.
//   • set-aside relevance — a set-aside the small biz can pursue.
//   • value — log-scaled contract ceiling (valueNum); bigger recompete counts, doesn't swamp fit.
function recompeteRecommendedScore(o){
  // Months until expiration (exp is YYYY-MM-DD). daysOut(o) already measures against o.exp for RECOMPETE.
  var d=daysOut(o); var months=isFinite(d)?d/30.44:NaN;
  var timing;
  if(!isFinite(months)) timing=0.3;
  else if(months<0) timing=0.1;                 // already expired — follow-on likely already out/gone
  else if(months<=6) timing=0.75;               // very near — solicitation likely already posted
  else if(months<=18) timing=1;                 // THE window — get ahead of the rebid
  else if(months<=30) timing=0.6;
  else timing=0.4;                              // far out — worth tracking, not pressing
  // Contract-type actionability from the awardTypeBadge language (task/delivery order, small buys).
  var ct=String(o.contractType||'').toUpperCase();
  var actionable=(ct.indexOf('TASK ORDER')>=0||ct.indexOf('DELIVERY ORDER')>=0||ct.indexOf('BPA')>=0||ct.indexOf('PURCHASE ORDER')>=0)?1
    :(ct.indexOf('DEFINITIVE')>=0?0.6:0.35);    // a bare parent IDIQ vehicle is the least directly-actionable
  var setAside=(o.set&&o.set!=='None'&&o.set!=='Open')?1:0;
  var v=Number(o.valueNum)||0;
  var valTerm=v>0?Math.min(1,Math.max(0,(Math.log10(v)-4)/5)):0;
  var s=0.42*timing + 0.24*actionable + 0.18*setAside + 0.16*valTerm;
  // Hard floor for an ALREADY-EXPIRED recompete: you can't chase a rebid that's gone, so it must never
  // outrank a live one no matter how attractive its size/set-aside/type (Eric 2026-07-28). Halve it so
  // it always sits below any live recompete — timing as a gate, not just a weighted term.
  if(isFinite(months)&&months<0) s*=0.5;
  return s;
}
function sortRows(a,b){
  switch(F.sort){
    case 'deadline-far':return dueDate(b).localeCompare(dueDate(a));
    case 'value':return valNum(b)-valNum(a);
    case 'az':return a.title.localeCompare(b.title);
    default:{
      // "Recommended" (empty F.sort) — each dataset uses its OWN relevance blend (Eric 2026-07-28,
      // "fix Recommended for all 4 categories"). OPEN/SAM opps → oppRecommendedScore; RECOMPETE →
      // recompeteRecommendedScore. Both rows must be the SAME kind to compare scores; otherwise
      // (mixed, shouldn't happen in one dataset view) fall back to the deadline order.
      var ar=(a.src==='RECOMPETE'), br=(b.src==='RECOMPETE');
      if(ar&&br){ var ra=recompeteRecommendedScore(a), rb=recompeteRecommendedScore(b); if(rb!==ra)return rb-ra; return dueDate(a).localeCompare(dueDate(b)); }
      if(!ar&&!br){ var sa=oppRecommendedScore(a), sb=oppRecommendedScore(b); if(sb!==sa)return sb-sa; return dueDate(a).localeCompare(dueDate(b)); }
      return dueDate(a).localeCompare(dueDate(b));
    }
  }
}
function render(){
  refreshFacets(); // union any newly-loaded horizon's src/cat into the (selected) filter sets first
  rows=OPPS.filter(pass).sort(sortRows);
  // map
  layer.clearLayers();markers.clear();
  // Zoom-aware clustering (Eric 2026-08-03): at LOW zoom collapse nearby opportunity pins into
  // count bubbles ("N Opportunities · $X"); at/above CLUSTER_MAX_ZOOM render individual value-tag
  // pins byte-for-byte as before. clusterRows/mkClusterBubble are hoisted PIN_JS globals shared
  // with the network renderContacts(). No refetch — clusters the rows ALREADY in hand. Guard: if
  // the helper is absent, fall through to the raw pins (all placed rows).
  const _cl=(typeof clusterRows==='function')?clusterRows(rows,map,64):{singles:rows,clusters:[]};
  _cl.clusters.forEach(cl=>{
    const cb=mkClusterBubble(cl,map,'opps');cb.addTo(layer);
  });
  _cl.singles.forEach(o=>{
    if(o.lat==null||o.lng==null)return; // list-only rows (unplaced forecasts) have no pin
    const col=srcColor(o);
    // Zillow value-tag pin: the $ on the pin IS the pin (M-Estimate median for Open, contract
    // value for Awarded). No value → a small neutral dot (never a fabricated price). Overlap is
    // allowed on purpose. mkPin/pinMoney are hoisted globals from PIN_JS.
    const _txt=(typeof pinMoney==='function')?pinMoney(o):'';
    const _approx=(o.locSrc==='office');
    const m=(typeof mkPin==='function')
      ? mkPin(o,col,_txt,_approx).bindPopup(popupHTML(o),{maxWidth:300,closeButton:true})
      : L.circleMarker([o.lat,o.lng],{radius:6,color:'#ffffff',weight:2,fillColor:col,fillOpacity:.95}).bindPopup(popupHTML(o),{maxWidth:300,closeButton:true});
    m.on('click',()=>select(o.sol,false));
    m.on('mouseover',()=>highlight(o.sol,true));
    m.on('mouseout',()=>highlight(o.sol,false));
    // Decision-card telemetry (Eric 2026-08-04): the popup OPEN + its CTA CLICK, both via the shared
    // __trackCard pipe (signed-in only, fire-and-forget). popup_open answers "which popup opens" +
    // carries lifecycle/identity; cta_click (delegated on .pv-cta so it survives the popup re-render)
    // answers "which CTA clicks / which lifecycle converts". A tracking miss never blocks the popup.
    m.on('popupopen',function(ev){
      try{ if(window.__trackCard) window.__trackCard('popup_open', o.sol||o.nid, o);
        var el=ev&&ev.popup&&ev.popup.getElement&&ev.popup.getElement();
        var cta=el&&el.querySelector&&el.querySelector('.pv-cta');
        if(cta&&!cta.__wired){ cta.__wired=1; cta.addEventListener('click',function(){
          try{ if(window.__trackCard) window.__trackCard('cta_click', o.sol||o.nid, o); }catch(e){} }); }
      }catch(e){}
    });
    m.addTo(layer);markers.set(o.sol,m);
  });
  // counts on filter buttons
  document.getElementById('c-src').textContent=F.src.size===3?'':F.src.size;
  document.getElementById('c-cat').textContent=F.cat.size===CATS.length?'':F.cat.size;
  document.getElementById('c-set').textContent=F.set.size===SETGROUPS.length?'':F.set.size;
  document.querySelectorAll('.fbtn[data-sheet]').forEach(b=>{
    const k=b.dataset.sheet,full=k==='src'?3:k==='cat'?CATS.length:SETGROUPS.length;
    b.classList.toggle('active',F[k].size!==full&&F[k].size>0);
  });
  // summary — NO subtitle line (Eric struck it through in red, Jul 26: "23 SDVOSB-eligible · N
  // closing this week" is clutter). The clean count lives on the sort row ("N results"), set by
  // updateHeader() in the viewport JS. This template render() path re-ran AFTER updateHeader cleared
  // it and re-populated the killed line (Eric 2026-07-28: "you snuck in the 23 sdvosb language").
  // Keep the sumline BLANK here so both paths agree. Do NOT reintroduce the SDVOSB/closing subtitle.
  const sumEl=document.getElementById('sumline'); if(sumEl)sumEl.innerHTML='';
  document.getElementById('rescount').innerHTML=
    `<span style="font-weight:700;color:var(--ink)">${rows.length}</span> <span style="font-weight:400;color:var(--sub)">result${rows.length===1?'':'s'}</span>`;
  drawFeed();
}
function drawFeed(){
  const feed=document.getElementById('feed');
  if(!rows.length){
    feed.innerHTML=`<div class="empty"><h4>No opportunities match</h4>
      <p>Try removing a filter or widening your service lines.</p>
      <button onclick="document.getElementById('clrAll').click()">Clear all filters</button></div>`;
    return;
  }
  feed.innerHTML='';
  rows.forEach(o=>{
    const c=document.createElement('article');
    c.className='card';c.dataset.sol=o.sol;c.tabIndex=0;
    c.innerHTML=cardHTML(o);
    c.onclick=()=>select(o.sol,true);
    c.onkeydown=e=>{if(e.key==='Enter')select(o.sol,true);};
    c.onmouseenter=()=>highlight(o.sol,true,true);
    c.onmouseleave=()=>highlight(o.sol,false,true);
    feed.appendChild(c);
  });
}
// Fetch-failure banner — a FAILED viewport fetch (network blip / mid-deploy chunk mismatch) must
// NOT read as a genuine "No opportunities match". _showFetchError paints an honest retry state and
// leaves any already-rendered cards in place; _clearFetchError removes it on the next good fetch.
// (The live viewport JS in route.ts calls these when every enabled horizon's fetch failed.)
function _showFetchError(){
  var feed=document.getElementById('feed'); if(!feed)return;
  if(document.getElementById('fetchErr'))return; // already shown — don't stack
  var b=document.createElement('div'); b.id='fetchErr'; b.className='empty';
  b.innerHTML='<h4>Couldn’t load this view</h4>'
    +'<p>The map hit a network hiccup. Your results are still here — try again.</p>'
    +'<button onclick="if(window.__mapRefetch)window.__mapRefetch()">Retry</button>';
  feed.insertBefore(b, feed.firstChild);
}
function _clearFetchError(){ var e=document.getElementById('fetchErr'); if(e)e.remove(); }
// list <-> map sync
function highlight(sol,on,fromCard){
  const m=markers.get(sol);
  if(m&&fromCard&&m.setStyle){
    const rec=m.options.fillOpacity<.8;
    m.setStyle({radius:on?(rec?11:9.5):(rec?7.5:6),weight:on?3:2});
    if(on&&m.bringToFront){try{m.bringToFront();}catch(e){}} // clustered marker may not be on the map
  }
  if(!fromCard){
    const c=document.querySelector(`.card[data-sol="${CSS.escape(sol)}"]`);
    if(c)c.classList.toggle('hot-hover',on);
  }
}
function select(sol,fly){
  selected=sol;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.dataset.sol===sol));
  const m=markers.get(sol);
  if(m){
    if(fly)map.flyTo(m.getLatLng(),Math.max(map.getZoom(),7),{duration:.6});
    m.openPopup();
  }
  const c=document.querySelector(`.card[data-sol="${CSS.escape(sol)}"]`);
  if(c&&!fly)c.scrollIntoView({block:'nearest'});
}

// ---------- sidebar collapse ----------
const appEl=document.querySelector('.app'),railBtn=document.getElementById('railBtn');
railBtn.onclick=()=>{
  const hid=appEl.classList.toggle('collapsed');
  railBtn.classList.toggle('collapsed',hid);
  railBtn.textContent=hid?'›':'‹';
  railBtn.title=railBtn.ariaLabel=hid?'Show list':'Hide list';
  // let the grid transition finish, then re-measure the map
  [80,180,300,420].forEach(t=>setTimeout(resize,t));
};

// ---------- progress ----------
const LEVELS=[["Emerging",0],["Active Bidder",250],["Contender",750],["Prime Ready",2000],["Award Winner",5000]];
let PROG={pts:0,week:0,streak:0,best:0,goal:500};
const sb=document.getElementById('sb');
document.getElementById('sbOpen').onclick=()=>sb.classList.add('open');
document.getElementById('sbClose').onclick=()=>sb.classList.remove('open');
function paintScore(){
  let i=0;for(let k=0;k<LEVELS.length;k++)if(PROG.pts>=LEVELS[k][1])i=k;
  const cur=LEVELS[i],nxt=LEVELS[Math.min(i+1,LEVELS.length-1)];
  document.getElementById('lvlName').textContent=cur[0].toUpperCase();
  document.getElementById('ptsVal').textContent=PROG.pts;
  document.getElementById('ptsMini').textContent=PROG.pts;
  document.getElementById('nextName').textContent=i<LEVELS.length-1?`Next: ${nxt[0]}`:'Max level';
  document.getElementById('nextGap').textContent=i<LEVELS.length-1?`${Math.max(0,nxt[1]-PROG.pts)} to go`:'—';
  document.getElementById('lvlFill').style.width=Math.min(100,((PROG.pts-cur[1])/((nxt[1]-cur[1])||1))*100)+'%';
  document.getElementById('weekPts').textContent=PROG.week;
  document.getElementById('goalTxt').textContent=`${PROG.week}/${PROG.goal}`;
  document.getElementById('streak').innerHTML=`${PROG.streak}🔥`;
  document.getElementById('best').textContent=PROG.best;
}
document.querySelectorAll('.lact').forEach(a=>{
  a.onclick=()=>{const p=+a.dataset.p;PROG.pts+=p;PROG.week+=p;
    if(PROG.week>PROG.best)PROG.best=PROG.week;if(!PROG.streak)PROG.streak=1;paintScore();};
});
document.getElementById('resetProg').onclick=()=>{PROG={pts:0,week:0,streak:0,best:0,goal:500};paintScore();};

document.addEventListener('click',e=>{
  if(openSheet&&!e.target.closest('.fbar'))closeSheet();
});

render();paintScore();fitView();
</script>
